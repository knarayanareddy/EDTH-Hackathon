<div class="warning"><b>Offline by design:</b> this file contains its code and uses no server or database. Your recording is read in your browser; session exports are saved only when you choose. Treat exported names, coordinates, metrics and notes as potentially sensitive. No real recording has been validated.</div>
<section class="box"><h2>1 \xB7 Source and shared decoder</h2><div class="bar"><label>Local uint16 file<input id="file" type="file"></label><button id="synth" class="alt">Use synthetic sample</button><button id="hash" class="alt">Calculate SHA-256 locally</button><span id="source" class="muted"></span></div><p class="muted">Headerless frames with optional one-time file header. The original six algorithms are 14-bit, so this evaluator intentionally supports only 14-bit values in uint16. Width/height must be even. File size alone does not verify format. Above-range bits are masked after shifting; confirm the sensor spec first.</p><div class="bar" id="settings"><label>Width<input id="w" type="number" value="640"></label><label>Height<input id="h" type="number" value="512"></label><label>Header bytes<input id="header" type="number" value="0"></label><label>Right shift<input id="shift" type="number" value="0" min="0" max="2"></label><label>Byte order<select id="endian"><option value="le">Little-endian</option><option value="be">Big-endian</option></select></label><label>Reference low<input id="lo" type="number" value="5500"></label><label>Reference high<input id="hi" type="number" value="7500"></label><button id="apply" class="alt">Apply decoder & window</button><button id="autoWindow" class="alt">Suggest window from current frame</button></div><p id="decoder" class="muted"></p><p id="hashtext" class="muted"></p></section>
<section class="box" id="tuneBox"><h2>Explore and tune \xB7 original engines</h2><p class="muted">Adjust a copy of the actual original method settings. Defaults remain untouched. Playback can show raw, your tuned version and the original default on the SAME frame. Changes during playback are disabled. You can optionally add the tuned preset as a frozen blind-review candidate below.</p><div class="bar"><label>Original method<select id="tuneMethod">${Gt.map(t=>`<option value="${t}">${Y(Se[t])}</option>`).join("")}</select></label><button id="tuneReset" class="alt">Restore method defaults</button><label>Preset name<input id="tuneName" value="My Argos 2"></label><button id="tuneSave">Save preset locally</button><label>Saved preset<select id="tuneSaved"></select></label><button id="tuneLoad" class="alt">Load saved</button><button id="tuneDelete" class="alt">Delete saved</button><button id="tuneExport" class="alt">Export preset JSON</button><label>Import preset JSON<input id="tuneImport" type="file" accept=".json,application/json"></label></div><p id="tuneStatus" class="muted">Changes are exploratory; use the button below to compare.</p><div id="tuneControls" class="bar"></div><button id="tuneCompare">Compare tuned vs original and play</button><p class="muted">The original Argos 2 fuses guided detail into its tone stage: its stage-4 toggle alone is not a complete detail bypass. Original Claude B may use future frames. Seek/pause restarts temporal state. Local browser storage can be cleared; export presets to keep them.</p></section>
<section class="box" id="cnnBox"><h2>Optional learning \xB7 local CNN cache</h2><p>Training, validation, approval and rollback use the separate local command-line tools described in README_INTEGRATED.md. Selecting or attaching a cache does not retrain or promote a model. Cache approval labels are local metadata, not independent proof.</p><p class="muted">Load the <code>manifest.json</code> and <code>frames.u16</code> written by <code>python -m clearhot_cnn infer</code> for THIS recording. The viewer re-checks the recording's full SHA-256, decoder, frame count and cache hash, and refuses any mismatch. It never shows a neighbouring frame in place of a missing one. Restored values are 14-bit counts, not temperatures. Then choose <b>Compare: raw | Argos 2 | CNN</b> in the playback method list.</p><div class="bar"><label>Cache manifest.json<input id="cnnManifest" type="file" accept=".json,application/json"></label><label>Cache frames.u16<input id="cnnFrames" type="file"></label><button id="cnnAttach" class="alt">Verify &amp; attach cache</button><button id="cnnBypass" class="alt">Bypass CNN (classical only)</button></div><p id="cnnStatus" class="muted">No CNN cache attached. Argos 2 and the raw reference work without it.</p></section>
<section class="box"><h2>\u25B6 Video playback \xB7 local</h2><div class="bar"><label>Display method<select id="playMethod"><option value="raw">Raw fixed-window reference (fast)</option><option value="cnn-compare">Compare: raw | Argos 2 (native + common window) | CNN cache</option><option value="tuned-compare">Compare: raw | tuned | original default</option>${He.map(t=>`<option value="${t}" ${t==="argos2"?"selected":""}>${Y(Se[t])}</option>`).join("")}</select></label><label>Target playback fps<select id="playFps"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>15</option><option>25</option><option>30</option></select></label><button id="play">\u25B6 Play from current frame</button><button id="restart" class="alt">\u21A4 Start over</button><button id="showFrame" class="alt">Show selected method on this frame</button></div><label style="width:100%;margin-top:10px">Seek through recording<input id="seek" type="range" min="0" max="31" value="0" step="1" style="width:100%"></label><p id="playerStatus" role="status" class="muted">Ready. Select a recording or use the synthetic sample, then press Play.</p><div class="grid"><div class="card"><h3>Reference \xB7 raw, fixed window</h3><canvas id="playerRaw"></canvas></div><div class="card"><h3 id="playerTitle">Selected processed method</h3><canvas id="playerProcessed"></canvas></div><div class="card" id="cardClassical" style="display:none"><h3>Argos 2 stage-1 counts \xB7 common fixed window</h3><canvas id="playerClassical"></canvas></div><div class="card" id="cardCnn" style="display:none"><h3 id="cnnTitle">CNN cache \xB7 common fixed window</h3><canvas id="playerCnn"></canvas><p id="cnnFrameId" class="muted"></p></div></div><p class="muted">The selected method is named here, so do not use playback during a blinded review. Plays all whole frames sequentially, without intentionally skipping; processing may run slower than the target. The file does not contain verified frame timing, so choose an appropriate fps. Temporal state is kept within each play run and reset on pause, seek, source or method changes. Claude B uses other frames, including possible look-ahead; it is an offline method, not causal streaming. Raw/processed images are display intensities, not temperatures.</p></section>
<section class="box"><h2>2 \xB7 Evaluation plan</h2><div class="bar"><label>Frame index<input id="frame" type="number" value="0" min="0"></label><button id="prev" class="alt">\u2190 Previous</button><button id="next" class="alt">Next \u2192</button><label>Split<select id="split"><option>development</option><option>held-out</option></select></label><label><input id="includeTuned" type="checkbox"> Include tuned preset as extra blind candidate when frozen</label><button id="freeze">Freeze settings</button><button id="unfreeze" class="alt">Unlock / start new plan</button><button id="shuffle" class="alt">New blind order</button><button id="reveal" class="alt">Reveal method names</button></div><p class="muted">Optionally include your tuned preset as a 13th blind candidate. Freeze captures it and locks its controls. Freeze locks source, decoder, window and method settings. Reserve different sequences before tuning; this tool records your split label but cannot enforce truly independent recordings. Every run starts fresh temporal state for reproducible single-frame comparisons. Claude B retains its original offline multi-frame behaviour and may read future frames; it is not real-time causal. All methods receive the same decoded current frame, but their NATIVE outputs use different internal AGC/tone maps; only the reference and new-lab method use the shared fixed window. The CNN comparison view additionally shows Argos 2 stage-1 counts and the CNN counts through the SAME fixed window (a controlled common-tone view); Argos 2's later stages cannot be remapped to that domain fairly, so its native output is shown separately.</p><p id="plan" class="good"></p><p id="status" role="status"></p></section>
<section class="box"><h2>3 \xB7 Place shared ROIs, then run</h2><div class="flex"><div class="reference"><p>Fixed-window raw reference \xB7 drag to draw</p><canvas id="reference"></canvas><p class="muted">ROIs are common to every method. Check their placement after moving to another frame. Counts are uncalibrated sensor values, not \xB0C. A rectangle is not an object segmentation.</p></div><div style="flex:1;min-width:260px"><div class="bar"><label>ROI role<select id="role"><option>animal</option><option>bridge</option><option>background</option><option>thin feature</option><option>stripe / flat region</option></select></label><button id="clearRoi" class="alt">Clear all ROIs</button><button id="loadFrame" class="alt">Load reference frame</button></div><div id="roiList"></div><p class="muted">Use separate rectangles for animal, nearby background, bridge, thin structures and flat striped areas. Change frame and reposition them for moving objects.</p><button id="run">Run frozen comparison on this frame</button> <button id="save" disabled>Record measurements & ratings</button><p class="muted">Full-size processing is compute-intensive and can take time. Timings include each method\u2019s wrapper and differ in internal work; they are not production throughput. Run without other heavy applications for a rough local comparison.</p></div></div></section>
<section class="box"><h2>4 \xB7 Blind review and measurements</h2><p class="muted">Choose scores independently before revealing names: 1 poor \u2192 5 good. These subjective scores are not ground truth. Pixel medians and robust spread are descriptive, not classification or temperature. Consecutive-frame difference is motion-contaminated and not a standalone flicker score.</p><div id="results" class="grid"></div></section>
