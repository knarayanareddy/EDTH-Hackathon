nstrument or operational detection system.</p></header><main class="wrap">
<div class="warning"><b>Offline by design:</b> this file contains its code and uses no server or database. Your recording is read in your browser; session exports are saved only when you choose. Treat exported names, coordinates, metrics and notes as potentially sensitive. No real recording has been validated.</div>
<section class="box"><h2>1 \xB7 Source and shared decoder</h2><div class="bar"><label>Local uint16 file<input id="file" type="file"></label><button id="synth" class="alt">Use synthetic sample</button><button id="hash" class="alt">Calculate SHA-256 locally</button><span id="source" class="muted"></span></div><p class="muted">Headerless frames with optional one-time file header. The original six algorithms are 14-bit, so this evaluator intentionally supports only 14-bit values in uint16. Width/height must be even. File size alone does not verify format. Above-range bits are masked after shifting; confirm the sensor spec first.</p><div class="bar" id="settings"><label>Width<input id="w" type="number" value="640"></label><label>Height<input id="h" type="number" value="512"></label><label>Header bytes<input id="header" type="number" value="0"></label><label>Right shift<input id="shift" type="number" value="0" min="0" max="2"></label><label>Byte order<select id="endian"><option value="le">Little-endian</option><option value="be">Big-endian</option></select></label><label>Reference low<input id="lo" type="number" value="5500"></label><label>Reference high<input id="hi" type="number" value="7500"></label><button id="apply" class="alt">Apply decoder & window</button><button id="autoWindow" class="alt">Suggest window from current frame</button></div><p id="decoder" class="muted"></p><p id="hashtext" class="muted"></p></section>
<section class="box"><h2>\u25B6 Video playback \xB7 local</h2><div class="bar"><label>Display method<select id="playMethod"><option value="raw">Raw fixed-window reference (fast)</option>${Se.map(e=>`<option value="${e}" ${e==="argos2"?"selected":""}>${oe(_e[e])}</option>`).join("")}</select></label><label>Target playback fps<select id="playFps"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>15</option><option>25</option><option>30</option></select></label><button id="play">\u25B6 Play from current frame</button><button id="restart" class="alt">\u21A4 Start over</button><button id="showFrame" class="alt">Show selected method on this frame</button></div><label style="width:100%;margin-top:10px">Seek through recording<input id="seek" type="range" min="0" max="31" value="0" step="1" style="width:100%"></label><p id="playerStatus" role="status" class="muted">Ready. Select a recording or use the synthetic sample, then press Play.</p><div class="grid"><div class="card"><h3>Reference \xB7 raw, fixed window</h3><canvas id="playerRaw"></canvas></div><div class="card"><h3 id="playerTitle">Selected processed method</h3><canvas id="playerProcessed"></canvas></div></div><p class="muted">The selected method is named here, so do not use playback during a blinded review. Plays all whole frames sequentially, without intentionally skipping; processing may run slower than the target. The file does not contain verified frame timing, so choose an appropriate fps. Temporal state is kept within each play run and reset on pause, seek, source or method changes. Claude B uses other frames, including possible look-ahead; it is an offline method, not causal streaming. Raw/processed images are display intensities, not temperatures.</p></section>
<section class="box"><h2>2 \xB7 Evaluation plan</h2><div class="bar"><label>Frame index<input id="frame" type="number" value="0" min="0"></label><button id="prev" class="alt">\u2190 Previous</button><button id="next" class="alt">Next \u2192</button><label>Split<select id="split"><option>development</option><option>held-out</option></select></label><button id="freeze">Freeze settings</button><button id="unfreeze" class="alt">Unlock / start new plan</button><button id="shuffle" class="alt">New blind order</button><button id="reveal" class="alt">Reveal method names</button></div><p class="muted">Freeze locks source, decoder, window and method settings. Reserve different sequences before tuning; this tool records your split label but cannot enforce truly independent recordings. Every run starts fresh temporal state for reproducible single-frame comparisons. Claude B retains its original offline multi-frame behaviour and may read future frames; it is not real-time causal. All methods receive the same decoded current frame, but their internal tone maps differ; only the reference and new-lab method use the shared fixed window.</p><p id="plan" class="good"></p><p id="status" role="status"></p></section>
<section class="box"><h2>3 \xB7 Place shared ROIs, then run</h2><div class="flex"><div class="reference"><p>Fixed-window raw reference \xB7 drag to draw</p><canvas id="reference"></canvas><p class="muted">ROIs are common to every method. Check their placement after moving to another frame. Counts are uncalibrated sensor values, not \xB0C. A rectangle is not an object segmentation.</p></div><div style="flex:1;min-width:260px"><div class="bar"><label>ROI role<select id="role"><option>animal</option><option>bridge</option><option>background</option><option>thin feature</option><option>stripe / flat region</option></select></label><button id="clearRoi" class="alt">Clear all ROIs</button><button id="loadFrame" class="alt">Load reference frame</button></div><div id="roiList"></div><p class="muted">Use separate rectangles for animal, nearby background, bridge, thin structures and flat striped areas. Change frame and reposition them for moving objects.</p><button id="run">Run all methods on this frame</button> <button id="save" disabled>Record measurements & ratings</button><p class="muted">Full-size processing is compute-intensive and can take time. Timings include each method\u2019s wrapper and differ in internal work; they are not production throughput. Run without other heavy applications for a rough local comparison.</p></div></div></section>
